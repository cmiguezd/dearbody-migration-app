<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dearbody Store Migration</title><style>body{font-family:system-ui;margin:40px;max-width:980px}select,button{padding:10px;margin:6px 0}fieldset{margin:18px 0;padding:16px}label{display:block;margin:8px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}</style></head>
<body><h1>Dearbody Store Migration</h1><p>Connect both Shopify stores, select the data to migrate, validate, then run.</p><div class="grid"><label>Source shop<input id="source" placeholder="source.myshopify.com"></label><label>Destination shop<input id="destination" placeholder="destination.myshopify.com"></label></div><fieldset><legend>Resources</legend><label><input type="checkbox" value="theme" checked> Theme</label><label><input type="checkbox" value="pages" checked> Pages</label><label><input type="checkbox" value="metafieldDefinitions" checked> Metafield definitions</label><label><input type="checkbox" value="metafields"> Metafield values</label><label><input type="checkbox" value="menus" checked> Menus</label><label><input type="checkbox" value="files" checked> Files/assets</label><label><input type="checkbox" value="collections"> Collections</label><label><input type="checkbox" value="products"> Products</label></fieldset><button id="validate">Validate migration</button><button id="execute" disabled>Run migration</button><pre id="result"></pre><script>let lastPlan;function plan(){const selection={};document.querySelectorAll('input[type=checkbox]').forEach(x=>selection[x.value]=x.checked);return {sourceShop:source.value,destinationShop:destination.value,selection,dryRun:false}}document.querySelector('#validate').onclick=async()=>{lastPlan=plan();lastPlan.dryRun=true;const r=await fetch('/api/migrations/validate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(lastPlan)});const data=await r.json();result.textContent=JSON.stringify(data,null,2);execute.disabled=!data.valid;lastPlan.dryRun=false};document.querySelector('#execute').onclick=async()=>{execute.disabled=true;const r=await fetch('/api/migrations/execute',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(lastPlan||plan())});result.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
